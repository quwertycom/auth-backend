name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  setup:
    name: Setup .NET
    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ env.DOTNET_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache .NET
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

  restore:
    name: Restore Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
      - name: Clear NuGet Cache
        run: dotnet nuget locals all --clear
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} --verbosity normal
      - name: Cache Restored Project
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored

  security-scan:
    name: Security Scan
    needs: restore
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Security Analysis
        run: |
          dotnet list package --vulnerable --include-transitive
          dotnet build ${{ env.SOLUTION_FILE }} /warnaserror /p:TreatWarningsAsErrors=true --configuration Release

  dependency-check:
    name: Dependency Analysis
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Check Package Dependencies
        run: |
          echo "Checking for duplicate packages..."
          dotnet list ${{ env.SOLUTION_FILE }} package > packages.txt
          cat packages.txt | grep '>' | sort | uniq -d || true
          
          echo "Checking package version consistency..."
          dotnet list ${{ env.SOLUTION_FILE }} package --vulnerable --include-transitive
          
          echo "Checking for deprecated packages..."
          dotnet list ${{ env.SOLUTION_FILE }} package --deprecated

  format-check:
    name: Check Code Format
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
      - name: Check Format
        run: dotnet format --verify-no-changes ${{ env.SOLUTION_FILE }}

  code-quality:
    name: Code Quality
    needs: restore
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Restore and Build for CodeQL
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  project-structure:
    name: Project Structure Check
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Validate Project Structure
        run: |
          echo "Checking solution structure..."
          dotnet sln ${{ env.SOLUTION_FILE }} list
          
          echo "Checking for circular dependencies..."
          dotnet build ${{ env.SOLUTION_FILE }} --no-restore

  assembly-check:
    name: Assembly Validation
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Check Assembly Info
        run: |
          echo "Checking assembly versions..."
          find . -name "*.csproj" -type f -exec grep -l "<Version>" {} \; | while read file; do
            echo "Checking $file"
            cat "$file" | grep "<Version>"
          done
          
          echo "Checking for strong naming..."
          find . -name "*.csproj" -type f -exec grep -l "<SignAssembly>" {} \;

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} --verbosity normal
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/Release/

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Unit Tests
        run: dotnet test Tests/API.UnitTests/API.UnitTests.csproj --no-build --verbosity normal --configuration Release

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Integration Tests
        run: dotnet test Tests/API.IntegrationTests/API.IntegrationTests.csproj --no-build --verbosity normal --configuration Release

  functional-tests:
    name: Functional Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Functional Tests
        run: dotnet test Tests/API.FunctionalTests/API.FunctionalTests.csproj --no-build --verbosity normal --configuration Release

  performance-tests:
    name: Performance Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Performance Tests
        run: dotnet test Tests/API.PerformanceTests/API.PerformanceTests.csproj --no-build --verbosity normal --configuration Release

  api-compatibility:
    name: API Compatibility Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Install ApiPort
        run: dotnet tool install -g Microsoft.DotNet.ApiCompat.Tool
      - name: Check API Compatibility
        run: |
          echo "Checking API surface..."
          find . -name "*.dll" -path "*/bin/Release/*" -not -path "*/ref/*" -not -path "*/Tests/*" -exec dotnet-api-compare {} \;

  api-health:
    name: API Health Check
    needs: [unit-tests, integration-tests, functional-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build API
        run: dotnet build API/API.csproj --configuration Release
      - name: Start API and Wait
        run: |
          dotnet run --project API/API.csproj --configuration Release --no-build &
          echo "Waiting for API to start..."
          # Wait for up to 30 seconds for the API to start
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start within 30 seconds"
              exit 1
            fi
            echo "Attempt $i: API not ready yet..."
            sleep 1
          done
      - name: Check API Endpoints
        run: |
          curl -v -H "Accept: application/json" http://localhost:8000/api || exit 1
          curl -v -H "Accept: application/json" http://localhost:8000/health || exit 1

  docker-build:
    name: Docker Build & Test
    needs: [unit-tests, integration-tests, functional-tests, api-health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auth-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  db-model-validation:
    name: Database Model Validation
    needs: restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Install EF Core tools
        run: |
          dotnet new tool-manifest
          dotnet tool install dotnet-ef
          
      - name: Verify Database Context
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=testdb;Username=postgres;Password=postgres"
        run: |
          echo "Verifying database context and models..."
          dotnet ef dbcontext info --project API/API.csproj --verbose
          dotnet ef dbcontext list --project API/API.csproj --verbose
          
      - name: Check Model Relationships
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=testdb;Username=postgres;Password=postgres"
        run: |
          echo "Checking model relationships and configurations..."
          # Add verbose output for debugging
          echo "Current directory: $(pwd)"
          echo "Project path: $(realpath API/API.csproj)"
          echo "Connection string: $ConnectionStrings__DefaultConnection"
          
          # Remove any existing generated models
          rm -rf API/Models/Generated || true
          rm -f API/Data/TestdbContext.cs || true
          
          # Create the Generated directory
          mkdir -p API/Models/Generated
          
          # Run scaffold
          dotnet ef dbcontext scaffold "Host=localhost;Database=testdb;Username=postgres;Password=postgres" Npgsql.EntityFrameworkCore.PostgreSQL --project API/API.csproj --context-dir Data --output-dir Models/Generated --no-onconfiguring --force --verbose
          
      - name: Validate Migration Scripts
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=testdb;Username=postgres;Password=postgres"
        run: |
          echo "Validating migration scripts..."
          # Add verbose output for debugging
          echo "Current directory: $(pwd)"
          echo "Project path: $(realpath API/API.csproj)"
          echo "Migrations directory content:"
          ls -la API/Data/Migrations || echo "Migrations directory not found"
          
          # Build the project first to ensure all dependencies are resolved
          dotnet build API/API.csproj --verbosity detailed
          
          # Run migration script generation with verbose output
          dotnet ef migrations script --project API/API.csproj --idempotent --verbose || {
            echo "Error generating migration script. Exit code: $?"
            echo "Project structure:"
            find API -type f -name "*.cs" -o -name "*.csproj"
            exit 1
          }
          
      - name: Check Naming Conventions
        run: |
          echo "Checking naming conventions..."
          # Verify table names are in snake_case
          dotnet ef dbcontext info --project API/API.csproj | grep -i "table" | grep -v "_" && echo "Warning: Found tables not using snake_case"
          
      - name: Verify Indexes and Constraints
        run: |
          echo "Verifying indexes and constraints..."
          dotnet ef dbcontext info --project API/API.csproj --json > context-info.json
          
      - name: Upload Migration Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-analysis
          path: |
            migration.sql
            context-info.json
