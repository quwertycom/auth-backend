name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # Sample values (safe to commit)
  ASPNETCORE_ENVIRONMENT: Production
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  # Email settings for MailHog
  EMAIL_HOST: localhost
  EMAIL_PORT: 1025
  EMAIL_ENABLE_SSL: false
  EMAIL_FROM: noreply@example.com
  EMAIL_USERNAME: test
  EMAIL_PASSWORD: test
  DOCKER_RUNNING: true
  JWT_ISSUER: auth-backend-ci
  JWT_AUDIENCE: auth-client-ci

  # Secret references (do not modify these)
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

jobs:
  setup:
    name: Setup .NET
    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ env.DOTNET_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache .NET
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

  restore:
    name: Restore Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
      - name: Clear NuGet Cache
        run: dotnet nuget locals all --clear
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} --verbosity normal
      - name: Cache Restored Project
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored

  security-scan:
    name: Security Scan
    needs: restore
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Security Analysis
        run: |
          dotnet list package --vulnerable --include-transitive
          dotnet build ${{ env.SOLUTION_FILE }} /warnaserror /p:TreatWarningsAsErrors=true --configuration Release

  dependency-check:
    name: Dependency Analysis
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
        
      - name: Check for Duplicate Packages
        id: duplicate-check
        run: |
          echo "Checking for duplicate packages..."
          # Create a temporary file for the full package list
          TEMP_FILE=$(mktemp)
          
          # Use tee to both display and save output
          if ! dotnet list "${GITHUB_WORKSPACE}/${{ env.SOLUTION_FILE }}" package | tee "$TEMP_FILE"; then
            echo "::error::Failed to list packages"
            rm "$TEMP_FILE"
            exit 1
          fi
          
          # Find duplicates but exclude common test packages
          echo "Analyzing package references..."
          DUPLICATES=$(grep -E "^   >" "$TEMP_FILE" | \
            grep -v -E "FluentAssertions|Microsoft.AspNetCore.Mvc.Testing|Microsoft.NET.Test.Sdk|coverlet.collector|xunit|NSubstitute|Moq|System.Net.Http.Json|System.Text.Json" | \
            sort | uniq -d)
          
          if [ ! -z "$DUPLICATES" ]; then
            {
              echo "::error::Found problematic duplicate packages:"
              echo "The following packages are duplicated with different versions or in non-test projects:"
              echo "$DUPLICATES"
              echo -e "\nPackages found in these projects:"
              
              while IFS= read -r dup; do
                echo -e "\nPackage: $dup"
                # Find project sections containing this package
                sed -n '/Project/,/^$/p' "$TEMP_FILE" | grep -B1 -A1 "$(echo "$dup" | sed 's/[]\[\^\$\.\*\/]/\\&/g')" || true
              done <<< "$DUPLICATES"
            } 2>&1
            rm "$TEMP_FILE"
            exit 1
          fi
          
          echo "ℹ️ Note: Common test packages are allowed to be duplicated across test projects:"
          echo "- FluentAssertions"
          echo "- Microsoft.AspNetCore.Mvc.Testing"
          echo "- Microsoft.NET.Test.Sdk"
          echo "- coverlet.collector"
          echo "- xunit packages"
          echo "- Test framework packages (NSubstitute, Moq)"
          echo "- System.Net.Http.Json"
          echo "- System.Text.Json"
          echo "✅ No problematic duplicate packages found"
          rm "$TEMP_FILE"
          
      - name: Check for Vulnerable Packages
        id: vulnerability-check
        run: |
          echo "Checking for vulnerable packages..."
          # Create a temporary file for vulnerability check
          TEMP_FILE=$(mktemp)
          
          # Use tee to both display and save output
          if ! dotnet list "${GITHUB_WORKSPACE}/${{ env.SOLUTION_FILE }}" package --vulnerable --include-transitive | tee "$TEMP_FILE"; then
            echo "::error::Failed to check for vulnerabilities"
            rm "$TEMP_FILE"
            exit 1
          fi
          
          if grep -q "has the following vulnerable packages" "$TEMP_FILE"; then
            {
              echo "::error::Vulnerable packages found:"
              echo "Details of vulnerable packages:"
              sed -n '/has the following vulnerable packages/,/^[[:space:]]*$/p' "$TEMP_FILE"
            } 2>&1
            rm "$TEMP_FILE"
            exit 1
          fi
          rm "$TEMP_FILE"
          echo "✅ No vulnerable packages found"
          
      - name: Check for Deprecated Packages
        id: deprecated-check
        run: |
          echo "Checking for deprecated packages..."
          # Create a temporary file for deprecated check
          TEMP_FILE=$(mktemp)
          
          # Use tee to both display and save output
          if ! dotnet list "${GITHUB_WORKSPACE}/${{ env.SOLUTION_FILE }}" package --deprecated | tee "$TEMP_FILE"; then
            echo "::error::Failed to check for deprecated packages"
            rm "$TEMP_FILE"
            exit 1
          fi
          
          if grep -q "has the following deprecated packages" "$TEMP_FILE"; then
            {
              echo "::error::Deprecated packages found:"
              echo "Details of deprecated packages:"
              sed -n '/has the following deprecated packages/,/^[[:space:]]*$/p' "$TEMP_FILE"
            } 2>&1
            rm "$TEMP_FILE"
            exit 1
          fi
          rm "$TEMP_FILE"
          echo "✅ No deprecated packages found"
          
      - name: Package Analysis Summary
        if: always()
        run: |
          echo "### Package Analysis Results 📦" >> $GITHUB_STEP_SUMMARY
          echo "#### Check Results" >> $GITHUB_STEP_SUMMARY
          echo "* Duplicate Packages: ${{ steps.duplicate-check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "* Vulnerable Packages: ${{ steps.vulnerability-check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "* Deprecated Packages: ${{ steps.deprecated-check.outcome }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.duplicate-check.outcome }}" != "success" ] || \
             [ "${{ steps.vulnerability-check.outcome }}" != "success" ] || \
             [ "${{ steps.deprecated-check.outcome }}" != "success" ]; then
            echo "### ❌ Package checks failed. See job logs for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ All package checks passed!" >> $GITHUB_STEP_SUMMARY
          fi

  format-check:
    name: Check Code Format
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
      - name: Check Format
        run: dotnet format --verify-no-changes ${{ env.SOLUTION_FILE }}

  code-quality:
    name: Code Quality
    needs: restore
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Restore and Build for CodeQL
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  project-structure:
    name: Project Structure Check
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Validate Project Structure
        run: |
          echo "Checking solution structure..."
          dotnet sln ${{ env.SOLUTION_FILE }} list
          
          echo "Checking for circular dependencies..."
          dotnet build ${{ env.SOLUTION_FILE }} --no-restore

  assembly-check:
    name: Assembly Validation
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Check Assembly Info
        run: |
          echo "Checking assembly versions..."
          find . -name "*.csproj" -type f -exec grep -l "<Version>" {} \; | while read file; do
            echo "Checking $file"
            cat "$file" | grep "<Version>"
          done
          
          echo "Checking for strong naming..."
          find . -name "*.csproj" -type f -exec grep -l "<SignAssembly>" {} \;

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} --verbosity normal
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      - name: Prepare Artifacts
        run: |
          # Create directories
          mkdir -p artifacts/api
          mkdir -p artifacts/tests/unit
          mkdir -p artifacts/tests/integration
          mkdir -p artifacts/tests/performance

          # Copy API files
          cp -r API/bin/Release/net8.0/* artifacts/api/
          cp API/appsettings.json artifacts/api/

          # Copy test files to their respective directories
          cp -r Tests/API.UnitTests/bin/Release/net8.0/* artifacts/tests/unit/
          cp -r Tests/API.IntegrationTests/bin/Release/net8.0/* artifacts/tests/integration/
          cp -r Tests/API.PerformanceTests/bin/Release/net8.0/* artifacts/tests/performance/

      - name: Upload API Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: artifacts/api/

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/tests/

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download API Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-artifacts
          path: API/bin/Release/net8.0
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: Tests
        # Extract unit test artifacts to the correct location
      - name: Setup Test Environment
        run: |
          mkdir -p Tests/API.UnitTests/bin/Release/net8.0
          cp -r Tests/unit/* Tests/API.UnitTests/bin/Release/net8.0/
      - name: Run Unit Tests
        run: dotnet test Tests/API.UnitTests/API.UnitTests.csproj --no-build --verbosity normal --configuration Release

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download API Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-artifacts
          path: API/bin/Release/net8.0
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: Tests
        # Extract integration test artifacts to the correct location
      - name: Setup Test Environment
        run: |
          mkdir -p Tests/API.IntegrationTests/bin/Release/net8.0
          cp -r Tests/integration/* Tests/API.IntegrationTests/bin/Release/net8.0/
      - name: Run Integration Tests
        env:
          ASPNETCORE_ENVIRONMENT: ${{ env.ASPNETCORE_ENVIRONMENT }}
          DOCKER_RUNNING: ${{ env.DOCKER_RUNNING }}
          # Database settings
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          # JWT settings
          JWT__SecretKey: ${{ env.JWT_SECRET_KEY }}
          JWT__Issuer: ${{ env.JWT_ISSUER }}
          JWT__Audience: ${{ env.JWT_AUDIENCE }}
          # Email settings
          Email__Host: ${{ env.EMAIL_HOST }}
          Email__Port: ${{ env.EMAIL_PORT }}
          Email__EnableSsl: ${{ env.EMAIL_ENABLE_SSL }}
          Email__Username: ${{ env.EMAIL_USERNAME }}
          Email__Password: ${{ env.EMAIL_PASSWORD }}
          Email__FromEmail: ${{ env.EMAIL_FROM }}
        run: dotnet test Tests/API.IntegrationTests/API.IntegrationTests.csproj --no-build --verbosity normal --configuration Release

  functional-tests:
    name: Functional Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download API Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-artifacts
          path: API/bin/Release/net8.0
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: Tests
      - name: Setup Test Environment
        run: |
          mkdir -p Tests/API.FunctionalTests/bin/Release/net8.0
          cp -r Tests/performance/* Tests/API.FunctionalTests/bin/Release/net8.0/
      - name: Run Functional Tests
        env:
          ASPNETCORE_ENVIRONMENT: ${{ env.ASPNETCORE_ENVIRONMENT }}
          DOCKER_RUNNING: ${{ env.DOCKER_RUNNING }}
          # JWT settings
          JWT__SecretKey: ${{ env.JWT_SECRET_KEY }}
          JWT__Issuer: ${{ env.JWT_ISSUER }}
          JWT__Audience: ${{ env.JWT_AUDIENCE }}
        run: dotnet test Tests/API.FunctionalTests/API.FunctionalTests.csproj --no-build --verbosity normal --configuration Release

  performance-tests:
    name: Performance Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download API Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-artifacts
          path: API/bin/Release/net8.0
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: Tests
      - name: Setup Test Environment
        run: |
          mkdir -p Tests/API.PerformanceTests/bin/Release/net8.0
          cp -r Tests/performance/* Tests/API.PerformanceTests/bin/Release/net8.0/
      - name: Run Performance Tests
        env:
          ASPNETCORE_ENVIRONMENT: ${{ env.ASPNETCORE_ENVIRONMENT }}
          DOCKER_RUNNING: ${{ env.DOCKER_RUNNING }}
          # JWT settings
          JWT__SecretKey: ${{ env.JWT_SECRET_KEY }}
          JWT__Issuer: ${{ env.JWT_ISSUER }}
          JWT__Audience: ${{ env.JWT_AUDIENCE }}
        run: dotnet test Tests/API.PerformanceTests/API.PerformanceTests.csproj --no-build --verbosity normal --configuration Release

  api-compatibility:
    name: API Compatibility Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Install ApiPort
        run: dotnet tool install -g Microsoft.DotNet.ApiCompat.Tool
      - name: Check API Compatibility
        run: |
          echo "Checking API surface..."
          find . -name "*.dll" -path "*/bin/Release/*" -not -path "*/ref/*" -not -path "*/Tests/*" -exec dotnet-api-compare {} \;

  api-health:
    name: API Health Check
    needs: [unit-tests, integration-tests, functional-tests]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Download API Artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-artifacts
          path: ./app
      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: ${{ env.ASPNETCORE_ENVIRONMENT }}
          DOCKER_RUNNING: ${{ env.DOCKER_RUNNING }}
          # Database settings
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}"
          # JWT settings
          JWT__SecretKey: ${{ env.JWT_SECRET_KEY }}
          JWT__Issuer: ${{ env.JWT_ISSUER }}
          JWT__Audience: ${{ env.JWT_AUDIENCE }}
          # Email settings
          Email__Host: ${{ env.EMAIL_HOST }}
          Email__Port: ${{ env.EMAIL_PORT }}
          Email__EnableSsl: ${{ env.EMAIL_ENABLE_SSL }}
          Email__Username: ${{ env.EMAIL_USERNAME }}
          Email__Password: ${{ env.EMAIL_PASSWORD }}
          Email__FromEmail: ${{ env.EMAIL_FROM }}
        run: |
          cd ./app
          dotnet API.dll &
          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start within 30 seconds"
              exit 1
            fi
            echo "Attempt $i: API not ready yet..."
            sleep 1
          done
      - name: Check API Health
        run: |
          curl -f http://localhost:8000/health || exit 1

  docker-build:
    name: Docker Build & Test
    needs: [unit-tests, integration-tests, functional-tests, api-health]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auth-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  db-model-validation:
    name: Database Model Validation
    needs: restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Install EF Core tools
        run: |
          dotnet new tool-manifest
          dotnet tool install dotnet-ef
          
      - name: Create appsettings.json for EF Tools
        run: |
          cat > API/appsettings.json << EOF
          {
            "ConnectionStrings": {
              "DefaultConnection": "Host=localhost;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}"
            },
            "JWT": {
              "SecretKey": "${{ env.JWT_SECRET_KEY }}",
              "Issuer": "${{ env.JWT_ISSUER }}",
              "Audience": "${{ env.JWT_AUDIENCE }}"
            },
            "Email": {
              "Host": "${{ env.EMAIL_HOST }}",
              "Port": ${{ env.EMAIL_PORT }},
              "EnableSsl": ${{ env.EMAIL_ENABLE_SSL }},
              "Username": "${{ env.EMAIL_USERNAME }}",
              "Password": "${{ env.EMAIL_PASSWORD }}",
              "FromEmail": "${{ env.EMAIL_FROM }}"
            }
          }
          EOF
          
      - name: Verify Database Context
        env:
          ASPNETCORE_ENVIRONMENT: ${{ env.ASPNETCORE_ENVIRONMENT }}
          DOCKER_RUNNING: ${{ env.DOCKER_RUNNING }}
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}"
          JWT__SecretKey: ${{ env.JWT_SECRET_KEY }}
          JWT__Issuer: ${{ env.JWT_ISSUER }}
          JWT__Audience: ${{ env.JWT_AUDIENCE }}
        run: |
          echo "Verifying database context and models..."
          dotnet ef dbcontext info --project API/API.csproj --verbose
          dotnet ef dbcontext list --project API/API.csproj --verbose
          
      - name: Check Model Relationships
        env:
          ASPNETCORE_ENVIRONMENT: ${{ env.ASPNETCORE_ENVIRONMENT }}
          DOCKER_RUNNING: ${{ env.DOCKER_RUNNING }}
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}"
          JWT__SecretKey: ${{ env.JWT_SECRET_KEY }}
          JWT__Issuer: ${{ env.JWT_ISSUER }}
          JWT__Audience: ${{ env.JWT_AUDIENCE }}
        run: |
          echo "Checking model relationships and configurations..."
          dotnet ef dbcontext info --project API/API.csproj --context AuthDbContext --verbose
          
      - name: Validate Migration Scripts
        env:
          ASPNETCORE_ENVIRONMENT: ${{ env.ASPNETCORE_ENVIRONMENT }}
          DOCKER_RUNNING: ${{ env.DOCKER_RUNNING }}
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}"
          JWT__SecretKey: ${{ env.JWT_SECRET_KEY }}
          JWT__Issuer: ${{ env.JWT_ISSUER }}
          JWT__Audience: ${{ env.JWT_AUDIENCE }}
        run: |
          echo "Validating migration scripts..."
          dotnet ef migrations script --project API/API.csproj --idempotent --verbose
