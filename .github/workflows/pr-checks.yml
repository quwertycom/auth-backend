name: PR Checks

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '52-refactor-and-enhance-code-quality' ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: qauth_password

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  Postgres__Host: localhost
  Postgres__Database: qauth_db
  Postgres__User: qauth_user
  Postgres__Password: qauth_password
  Jwt__SecretKey: test-secret-key-for-pr-workflow-testing-only
  Jwt__Issuer: auth-backend-dev
  Jwt__Audience: auth-client-dev

jobs:
  restore:
    name: Restore Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      
      - name: Cache Restored Project
        uses: actions/cache@v4
        with:
          path: |
            **/obj/
            **/bin/
          key: ${{ runner.os }}-restored-${{ github.sha }}

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Cached Project
        uses: actions/cache@v4
        with:
          path: |
            **/obj/
            **/bin/
          key: ${{ runner.os }}-restored-${{ github.sha }}
      
      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.pdb
            !**/bin/Release/**/ref/**
            
  health-check:
    name: Health Checks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Cached Project
        uses: actions/cache@v4
        with:
          path: |
            **/obj/
            **/bin/
          key: ${{ runner.os }}-restored-${{ github.sha }}
      
      - name: Security Check
        run: dotnet list package --vulnerable --include-transitive
        
      - name: Check Code Format
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --verbosity normal
        
      - name: Run Unit Tests
        run: dotnet test Tests/API.Tests.Unit/API.Tests.Unit.csproj --configuration Release --no-build
        
      - name: Docker Build Check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auth-backend:test
          target: development
