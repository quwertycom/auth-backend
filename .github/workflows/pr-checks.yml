name: PR Checks

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dev'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  setup:
    name: Setup .NET
    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ env.DOTNET_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache .NET
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

  restore:
    name: Restore Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Cache Restored Project
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored

  code-quality:
    name: Code Quality
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Restore and Build for CodeQL
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  format-check:
    name: Check Code Format
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
      - name: Check Format
        run: dotnet format --verify-no-changes ${{ env.SOLUTION_FILE }}

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/Release/

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Unit Tests
        run: dotnet test Tests/API.UnitTests/API.UnitTests.csproj --no-build --verbosity normal --configuration Release

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Integration Tests
        run: dotnet test Tests/API.IntegrationTests/API.IntegrationTests.csproj --no-build --verbosity normal --configuration Release

  api-health:
    name: API Health Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Start API
        run: |
          dotnet run --project API/API.csproj --configuration Release &
          sleep 15
      - name: Check Health
        run: |
          curl -v -H "Accept: application/json" http://localhost:8000/api || exit 1 