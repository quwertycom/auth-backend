name: PR Checks

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '52-refactor-and-enhance-code-quality' ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: qauth_password

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  POSTGRES_HOST: localhost
  POSTGRES_DATABASE: qauth_db
  JWT_SECRET_KEY: test-secret-key-for-pr-workflow-testing-only
  JWT_ISSUER: auth-backend-dev
  JWT_AUDIENCE: auth-client-dev

  # Sample Email Settings (for workflow testing)
  EMAIL_HOST: smtp.example.com
  EMAIL_PORT: 587
  EMAIL_ENABLE_SSL: true
  EMAIL_USERNAME: workflow_test_user
  EMAIL_PASSWORD: workflow_test_password
  EMAIL_FROM_DEFAULT: noreply@example.com
  EMAIL_TIMEOUT: 10000
  EMAIL_USE_DEFAULT_CREDENTIALS: false

jobs:
  restore:
    name: Restore Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.pdb
            **/bin/Release/**/*.runtimeconfig.json
            !**/bin/Release/**/ref/**
    
  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./build-artifacts

      - name: Run Unit Tests
        run: dotnet test ${{ github.workspace }}/Tests/API.Tests.Unit/API.Tests.Unit.csproj --configuration Release --no-build

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
            
            

  publish:
    name: Publish production version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
    
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./build-artifacts

      - name: Create Production Build
        run: dotnet publish ${{ env.SOLUTION_FILE }} --configuration Release --output ./publish-output

      - name: Upload Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-artifacts
          path: ./publish-output

  health-check:
    name: API Health Check
    needs: publish
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
     
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Publish Artifacts
        uses: actions/download-artifact@v4
        with:
          name: publish-artifacts
          path: ./publish-output
          
      - name: Start API Service and Run Health Checks
        run: |
          # Navigate to the published API directory.
          cd ./publish-output
          
          # Run the API in the background.
          dotnet API.dll &
          API_PID=$!
          echo "API PID: $API_PID"
          
          echo "Waiting for API to start..."
          # Give the API time to initialize.
          sleep 5
          
          # Wait for the API to respond to health checks.
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "API is up and responding to health checks!"
              sleep 2 # Allow services to fully initialize.
              break
            fi
            
            if [ $i -eq 30 ]; then # If API did not start in time.
              echo "API failed to respond to health checks within 60 seconds. Diagnostic info:"
              echo "Process status:"
              ps -ef | grep dotnet
              echo "Netstat output:"
              netstat -tlpn | grep 8000
              echo "Trying to access health endpoint with full output:"
              curl -v http://127.0.0.1:8000/health
              curl -v http://localhost:8000/health
              exit 1
            fi
            
            echo "Attempt $i: API not ready yet... waiting 2 seconds"
            sleep 2
          done
          
          # Perform health check on /health endpoint.
          echo "Performing health check..."
          HEALTH_RESPONSE=$(curl -s -w '%{http_code}' -o /dev/null http://127.0.0.1:8000/health)
          if [ "$HEALTH_RESPONSE" != "200" ]; then
            echo "Health check failed with status $HEALTH_RESPONSE"
            echo "Full response from health endpoint:"
            curl -v http://127.0.0.1:8000/health
            exit 1
          fi
          echo "Health check successful!"
          
          # Perform health check on /api endpoint.
          echo "Checking API base endpoint..."
          API_RESPONSE=$(curl -s -w '%{http_code}' -o /dev/null -H 'Accept: application/json' http://127.0.0.1:8000/api)
          if [ "$API_RESPONSE" != "200" ] && [ "$API_RESPONSE" != "404" ]; then
            echo "API check failed with status $API_RESPONSE"
            echo "Full response from API endpoint:"
            curl -v -H 'Accept: application/json' http://127.0.0.1:8000/api
            exit 1
          fi
          echo "API check successful!"
          
          # Kill the API process to clean up.
          kill $API_PID || true