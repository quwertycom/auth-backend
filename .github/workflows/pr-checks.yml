name: PR Checks

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '52-refactor-and-enhance-code-quality' ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: qauth_password

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  POSTGRES_HOST: localhost
  POSTGRES_DATABASE: qauth_db
  JWT_SECRET_KEY: test-secret-key-for-pr-workflow-testing-only
  JWT_ISSUER: auth-backend-dev
  JWT_AUDIENCE: auth-client-dev

jobs:
  restore:
    name: Restore Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.pdb
            !**/bin/Release/**/ref/**
            
  health-check:
    name: Health Checks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      
      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          context: API
          file: API/Dockerfile
          push: false
          tags: auth-backend:pr
          target: build

      - name: Run docker container
        run: IMAGE_TAG=pr docker compose up -d

      - name: Get health route with retry
        run: |
          for i in $(seq 1 10); do
            echo "Attempt $i of 10: Checking health endpoint..."
            sleep 5
            docker compose logs qauth-api
            if curl --fail http://localhost:8000/health; then
              echo "Health check successful."
              exit 0
            else
              echo "Health check failed. Retrying..."
            fi
          done
          echo "Health check failed after 10 attempts."
          exit 1