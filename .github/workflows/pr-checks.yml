name: PR Checks

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '52-refactor-and-enhance-code-quality' ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: qauth_password

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  POSTGRES_HOST: localhost
  POSTGRES_DATABASE: qauth_db
  JWT_SECRET_KEY: test-secret-key-for-pr-workflow-testing-only
  JWT_ISSUER: auth-backend-dev
  JWT_AUDIENCE: auth-client-dev

jobs:
  restore:
    name: Restore Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.pdb
            !**/bin/Release/**/ref/**
            
  health-check:
    name: API Health Check
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      
      - name: Start API and Wait
        run: |
          cd API
          dotnet API.dll &
          API_PID=$!
          echo "API PID: $API_PID"
          
          echo "Waiting for API to start..."
          # Wait for up to 60 seconds for the API to start
          for i in {1..60}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "API failed to start within 60 seconds. Showing logs:"
              jobs
              ps -ef | grep dotnet
              exit 1
            fi
            echo "Attempt $i: API not ready yet... waiting 2 seconds"
            sleep 2
          done
      
      - name: Check API Endpoints
        run: |
          # Perform health check
          echo "Performing health check..."
          HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$HEALTH_RESPONSE" != "200" ]; then
            echo "Health check failed with status $HEALTH_RESPONSE"
            exit 1
          fi
          echo "Health check successful!"
          
          # Check if API is accessible
          echo "Checking API base endpoint..."
          API_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/json" http://localhost:8000/api)
          if [ "$API_RESPONSE" != "200" ] && [ "$API_RESPONSE" != "404" ]; then
            echo "API check failed with status $API_RESPONSE"
            exit 1
          fi
          echo "API check successful!"