name: PR Checks

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '52-refactor-and-enhance-code-quality' ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: qauth_password

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  POSTGRES_HOST: localhost
  POSTGRES_DATABASE: qauth_db
  JWT_SECRET_KEY: test-secret-key-for-pr-workflow-testing-only
  JWT_ISSUER: auth-backend-dev
  JWT_AUDIENCE: auth-client-dev

jobs:
  restore:
    name: Restore Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.pdb
            !**/bin/Release/**/ref/**
            
  health-check:
    name: Health Checks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      
      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          context: API
          file: API/Dockerfile
          push: false
          tags: auth-backend:pr
          target: build

      - name: Run docker container
        run: IMAGE_TAG=pr docker compose up -d

      - name: List docker containers
        run: docker ps

      - name: Wait for API health check
        run: |
          echo "Waiting for API to be healthy..."
          for i in {1..30}; do
            CONTAINER_ID=$(docker-compose ps -q api)
            if [ -z "$CONTAINER_ID" ]; then
              echo "API container not found. Waiting..."
              sleep 5
              continue
            fi
            
            HEALTH_STATUS=$(docker inspect -f '{{.State.Health.Status}}' $CONTAINER_ID 2>/dev/null || echo "starting")
            echo "Current health status: $HEALTH_STATUS"
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "API is healthy!"
              exit 0
            fi
            if [ "$HEALTH_STATUS" = "unhealthy" ]; then
              echo "API is unhealthy! Displaying container logs:"
              docker logs $CONTAINER_ID
              exit 1
            fi
            echo "Waiting for 5 seconds..."
            sleep 5
          done
          echo "Timed out waiting for API to be healthy. Displaying container logs:"
          docker logs $CONTAINER_ID
          exit 1

      - name: Final Health Check Confirmation
        run: curl --fail http://localhost:8000/health

      - name: Stop and remove containers
        run: docker compose down