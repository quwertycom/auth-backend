name: PR Checks

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dev'

env:
  DOTNET_VERSION: '9.x.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
        
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
        
      - name: Run Unit Tests
        run: dotnet test Tests/API.UnitTests/API.UnitTests.csproj --no-build --verbosity normal --configuration Release
        
      - name: Run Integration Tests
        run: dotnet test Tests/API.IntegrationTests/API.IntegrationTests.csproj --no-build --verbosity normal --configuration Release

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Check Code Format
        run: |
          dotnet tool install -g dotnet-format
          dotnet format --verify-no-changes ${{ env.SOLUTION_FILE }}
          
      - name: Check Project Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
        
      - name: Check API Health
        run: |
          dotnet run --project API/API.csproj --configuration Release &
          sleep 15  # Give more time for the API to start
          curl -v -H "Accept: application/json" http://localhost:8000/api || exit 1 