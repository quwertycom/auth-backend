name: Push Checks

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dev'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  DOTNET_USE_POLLING_FILE_WATCHER: 1
  ASPNETCORE_DETAILED_ERRORS: 1
  Postgres__Host: localhost
  Postgres__Database: qauth_db
  Postgres__User: qauth_user
  Postgres__Password: qauth_password
  Jwt__SecretKey: your-super-secret-key-at-least-32-chars-long
  Jwt__Issuer: auth-backend-dev
  Jwt__Audience: auth-client-dev
  Email__Host: 127.0.0.1
  Email__Port: 9100
  Email__EnableSsl: false
  Email__Username: test
  Email__Password: test
  Email__From: auth@example.com
  Email__Timeout: 10000
  Email__UseDefaultCredentials: false
  Snowflake__DatacenterId: 1
  Snowflake__WorkerId: 1
  Snowflake__Epoch: 2024-01-01T00:00:00Z
  PasswordHasher__Iterations: 10000
  PasswordHasher__SaltSize: 16
  PasswordHasher__KeySize: 32
  Api__Port: 8000

jobs:
  restore:
    name: Restore Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
        
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
            **/obj/project.assets.json
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

  code-style-check:
    name: Check Code Style
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
        
      - name: Check code style
        run: |
          echo "Checking code style..."
          dotnet format --verify-no-changes ${{ env.SOLUTION_FILE }}
          if [ $? -ne 0 ]; then
            echo "Code style check failed. Please run 'dotnet format' locally to fix formatting issues."
            exit 1
          fi
          echo "Code style check passed!"

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
            **/obj/project.assets.json
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            API/bin/Release/net8.0/
            API/appsettings.json
            Tests/API.Tests.Unit/bin/Release/net8.0/

  unit-tests:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
          
      - name: Run Unit Tests
        run: dotnet test Tests/API.Tests.Unit/API.Tests.Unit.csproj --configuration Release --no-build

  api-health:
    name: API Health Check
    needs: build
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8000
      DOTNET_USE_POLLING_FILE_WATCHER: 1
      ASPNETCORE_DETAILED_ERRORS: 1
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      
      # Database Settings
      Postgres__Host: localhost
      Postgres__Database: qauth_db
      Postgres__User: qauth_user
      Postgres__Password: qauth_password
      
      # Application Settings
      Jwt__SecretKey: your-super-secret-key-at-least-32-chars-long
      Jwt__Issuer: auth-backend-dev
      Jwt__Audience: auth-client-dev
      Email__Host: 127.0.0.1
      Email__Port: 9100
      Email__EnableSsl: false
      Email__Username: test
      Email__Password: test
      Email__From: auth@example.com
      Email__Timeout: 10000
      Email__UseDefaultCredentials: false
      Snowflake__DatacenterId: 1
      Snowflake__WorkerId: 1
      Snowflake__Epoch: 2024-01-01T00:00:00Z
      PasswordHasher__Iterations: 10000
      PasswordHasher__SaltSize: 16
      PasswordHasher__KeySize: 32
      Api__Port: 8000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qauth_db
          POSTGRES_USER: qauth_user
          POSTGRES_PASSWORD: qauth_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
          
      - name: Verify NuGet Config
        run: |
          echo "Checking NuGet configuration..."
          dotnet nuget list source
          
      - name: Restore dependencies
        run: |
          echo "Restoring dependencies..."
          dotnet restore ${{ env.SOLUTION_FILE }}
          
      - name: Debug directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Checking for project.assets.json files:"
          find . -name "project.assets.json"
          
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h localhost -p 5432; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 1
          done
          echo "PostgreSQL is up and running!"
          
      - name: Start API
        run: |
          echo "Starting API from $(pwd)"
          dotnet run --project ./API/API.csproj > /tmp/api.log 2>&1 &
          echo "Waiting for API to start..."
          for i in {1..45}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up!"
              break
            fi
            if [ $i -eq 45 ]; then
              echo "API failed to start within 45 seconds"
              echo "Last few lines of API logs:"
              tail -n 50 /tmp/api.log
              exit 1
            fi
            echo "Attempt $i: API not ready yet..."
            sleep 1
          done
          
      - name: Check API Health
        run: |
          curl -v http://localhost:8000/health || exit 1
