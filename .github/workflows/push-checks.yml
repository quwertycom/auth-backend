name: Push Checks

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dev'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  setup:
    name: Setup .NET
    runs-on: ubuntu-latest
    outputs:
      dotnet-version: ${{ env.DOTNET_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache .NET
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

  restore:
    name: Restore Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
      - name: Clear NuGet Cache
        run: dotnet nuget locals all --clear
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} --verbosity normal
      - name: Cache Restored Project
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored

  db-model-check:
    name: Database Model Check
    needs: restore
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Database=auth_db;Username=postgres;Password=postgres"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Install EF Core tools
        run: |
          dotnet new tool-manifest
          dotnet tool install dotnet-ef
      - name: Create Design-Time DbContext Factory
        run: |
          mkdir -p API/Data
          cat << EOF > API/Data/DesignTimeDbContextFactory.cs
          using Microsoft.EntityFrameworkCore;
          using Microsoft.EntityFrameworkCore.Design;

          namespace API.Data;

          public class DesignTimeDbContextFactory : IDesignTimeDbContextFactory<AuthDbContext>
          {
              public AuthDbContext CreateDbContext(string[] args)
              {
                  var optionsBuilder = new DbContextOptionsBuilder<AuthDbContext>();
                  optionsBuilder.UseNpgsql("Host=localhost;Database=auth_db;Username=postgres;Password=postgres");
                  return new AuthDbContext(optionsBuilder.Options);
              }
          }
          EOF
      - name: Verify Database Context
        run: |
          echo "Verifying database context and models..."
          dotnet ef dbcontext info --project API/API.csproj
          dotnet ef dbcontext list --project API/API.csproj

  code-quality:
    name: Code Quality
    needs: restore
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Restore and Build for CodeQL
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  format-check:
    name: Check Code Format
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
      - name: Check Format
        run: dotnet format --verify-no-changes ${{ env.SOLUTION_FILE }}

  build:
    name: Build Solution
    needs: restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .
          key: ${{ github.sha }}-project-restored
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }} --verbosity normal
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/Release/

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Unit Tests
        run: dotnet test Tests/API.UnitTests/API.UnitTests.csproj --no-build --verbosity normal --configuration Release

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
          dotnet-quality: 'preview'
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Run Integration Tests
        run: dotnet test Tests/API.IntegrationTests/API.IntegrationTests.csproj --no-build --verbosity normal --configuration Release

  api-health:
    name: API Health Check
    needs: build
    runs-on: ubuntu-latest
    env:
      # Environment type
      ASPNETCORE_ENVIRONMENT: Production
      # Database Configuration
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # JWT Configuration
      JWT__SecretKey: your_test_jwt_secret_key_123_your_test_jwt_secret_key_123
      JWT__Issuer: auth-backend-test
      JWT__Audience: auth-backend-test
      # Password Hasher Configuration
      PasswordHasher__Pepper: your_test_pepper_key_123_your_test_pepper_key_123
      # Snowflake Configuration
      Snowflake__InstanceId: 1
      Snowflake__Epoch: 1704067200000
      # Email Configuration
      Email__Host: smtp.test.com
      Email__Port: 587
      Email__Username: test@test.com
      Email__Password: test_password
      Email__FromAddress: test@test.com
      Email__FromName: Auth Backend Test
      Email__UseSsl: true
      # Connection String (direct environment variable)
      ConnectionStrings__DefaultConnection: Host=localhost;Database=auth_db;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet-version }}
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build API
        run: dotnet build API/API.csproj --configuration Release
      - name: Start API and Wait
        run: |
          # Export all environment variables to be available to the API
          export $(cat << EOF | xargs
          ASPNETCORE_ENVIRONMENT=Production
          JWT__SecretKey=your_test_jwt_secret_key_123_your_test_jwt_secret_key_123
          JWT__Issuer=auth-backend-test
          JWT__Audience=auth-backend-test
          PasswordHasher__Pepper=your_test_pepper_key_123_your_test_pepper_key_123
          Snowflake__InstanceId=1
          Snowflake__Epoch=1704067200000
          Email__Host=smtp.test.com
          Email__Port=587
          Email__Username=test@test.com
          Email__Password=test_password
          Email__FromAddress=test@test.com
          Email__FromName=Auth Backend Test
          Email__UseSsl=true
          ConnectionStrings__DefaultConnection=Host=localhost;Database=auth_db;Username=postgres;Password=postgres
          EOF
          )
          
          dotnet run --project API/API.csproj --configuration Release --no-build &
          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start within 30 seconds"
              exit 1
            fi
            echo "Attempt $i: API not ready yet..."
            sleep 1
          done
      - name: Check API Endpoint
        run: |
          curl -v -H "Accept: application/json" http://localhost:8000/api || exit 1 