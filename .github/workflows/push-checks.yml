name: Push Checks

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dev'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: qauth_password

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  POSTGRES_HOST: localhost
  POSTGRES_DATABASE: qauth_db
  JWT_SECRET_KEY: test-secret-key-for-push-workflow-testing-only
  JWT_ISSUER: auth-backend-dev
  JWT_AUDIENCE: auth-client-dev

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore and Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore NuGet Packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      
      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
      
      - name: Check Code Format
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --verbosity normal
      
      - name: Security Check
        run: dotnet list package --vulnerable --include-transitive
      
      - name: Run Unit Tests
        run: dotnet test Tests/API.Tests.Unit/API.Tests.Unit.csproj --configuration Release --no-build
      
      - name: Docker Build Check
        uses: docker/build-push-action@v5
        with:
          context: .
          file: API/dockerfile
          push: false
          tags: auth-backend:test
          target: development
