name: Push Checks

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!dev'

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'Auth.sln'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
  # PostgreSQL Settings
  POSTGRES_DB: qauth_db
  POSTGRES_USER: qauth_user
  POSTGRES_PASSWORD: qauth_password

  # Application Settings
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://0.0.0.0:8000
  Postgres__Host: localhost
  Postgres__Database: qauth_db
  Postgres__User: qauth_user
  Postgres__Password: qauth_password
  Jwt__SecretKey: test-secret-key-for-push-workflow-testing-only
  Jwt__Issuer: auth-backend-dev
  Jwt__Audience: auth-client-dev

jobs:
  restore:
    name: Restore Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore NuGet Packages
        run: |
          echo "Restoring NuGet packages..."
          dotnet restore ${{ env.SOLUTION_FILE }}
      
      - name: Cache Restored Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}

  code-format:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      
      - name: Check Code Format
        run: |
          echo "Checking code formatting with dotnet format..."
          dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --verbosity normal

  build:
    name: Build Solution
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
      
      - name: Build Solution
        run: |
          echo "Building solution..."
          dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
      
      - name: Cache Build Output
        uses: actions/cache@v4
        with:
          path: |
            **/bin/
            **/obj/
          key: ${{ runner.os }}-build-${{ github.sha }}

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
      
      - name: Check for Vulnerable Packages
        run: |
          echo "Checking for vulnerable packages..."
          dotnet list package --vulnerable --include-transitive ${{ env.SOLUTION_FILE }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: |
            **/bin/
            **/obj/
          key: ${{ runner.os }}-build-${{ github.sha }}
      
      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
          dotnet test Tests/API.Tests.Unit/API.Tests.Unit.csproj --configuration Release --no-build --filter "Category!=Integration&Category!=Functional"

  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: auth-backend:test
          target: development # Use development target for quicker build
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Validate Docker Image
        run: |
          echo "Validating Docker image size and contents..."
          docker images auth-backend:test --format "{{.Repository}}:{{.Tag}} - Size: {{.Size}}"

  project-references-check:
    name: Project References Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: |
            **/bin/
            **/obj/
          key: ${{ runner.os }}-build-${{ github.sha }}
      
      - name: Verify Project References
        run: |
          echo "Checking project references and dependencies..."
          
          # Verify no test projects are referenced by main projects
          echo "Checking for test references in main projects..."
          if find . -name "*.csproj" ! -path "*/Tests/*" -exec grep -l "ProjectReference.*Tests" {} \; | grep -q .; then
            echo "::error::Found test project references in main projects"
            find . -name "*.csproj" ! -path "*/Tests/*" -exec grep -l "ProjectReference.*Tests" {} \;
            exit 1
          else
            echo "✅ No test projects referenced by main projects"
          fi
          
          # Check for circular references
          echo "Checking for potential circular references..."
          # Check using just error output to detect circular reference errors
          dotnet build ${{ env.SOLUTION_FILE }} --no-restore /clp:ErrorsOnly | grep -i "circular" || echo "✅ No circular references detected"
          
          echo "Project references check completed successfully!"

  naming-conventions-check:
    name: Naming Conventions Check
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Check Naming Conventions
        run: |
          echo "Checking naming conventions across the solution..."
          
          # Verify test projects follow naming convention
          echo "Checking test project naming conventions..."
          NON_COMPLIANT=false
          for proj in $(find . -path "*/Tests/*" -name "*.csproj"); do
            if [[ ! $proj =~ \.Tests\. ]]; then
              echo "::error::Test project $proj doesn't follow .Tests naming convention"
              NON_COMPLIANT=true
            fi
          done
          
          if [ "$NON_COMPLIANT" = true ]; then
            exit 1
          else
            echo "✅ All test projects follow naming conventions"
          fi
          
          # Check namespaces in .cs files (spot check)
          echo "Spot checking namespaces in C# files..."
          # Using temporary file to avoid broken pipe warning
          find API -name "*.cs" -type f -not -path "*/obj/*" -not -path "*/bin/*" | head -10 > /tmp/namespace_files.txt
          while read file; do
            namespace=$(grep -m 1 "namespace" "$file" || echo "No namespace found")
            echo "File: $file => $namespace"
          done < /tmp/namespace_files.txt
          
          echo "Naming conventions check completed!"

  project-structure-check:
    name: Project Structure Check
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Check Solution Structure
        run: |
          echo "Checking solution structure..."
          dotnet sln ${{ env.SOLUTION_FILE }} list
          
          # Check for overall solution structure
          echo "Checking overall solution structure..."
          
          # Check for src/API and test directories pattern
          if [ -d "API" ] && [ -d "Tests" ]; then
            echo "✅ Project follows the 'API/Tests' directory structure"
          else
            echo "Warning: Project structure doesn't follow the recommended API/Tests pattern"
          fi
          
          # Check that tests are properly separated from main code
          MAIN_PROJECTS=$(find . -name "*.csproj" ! -path "*/Tests/*" | wc -l)
          TEST_PROJECTS=$(find . -path "*/Tests/*" -name "*.csproj" | wc -l)
          echo "Found $MAIN_PROJECTS main project(s) and $TEST_PROJECTS test project(s)"
          
          if [ "$TEST_PROJECTS" -eq 0 ]; then
            echo "::warning::No test projects found in the Tests directory"
          else
            echo "✅ Test projects are properly organized in Tests directory"
          fi
          
          # Check for standard project files and directories
          echo "Checking for standard project files and structure in main project(s)..."
          for proj_dir in $(find . -name "*.csproj" ! -path "*/Tests/*" -exec dirname {} \;); do
            echo "Checking directory structure for $proj_dir..."
            
            # Check for Properties directory
            if [ ! -d "$proj_dir/Properties" ]; then
              echo "Warning: $proj_dir is missing Properties directory"
            else
              echo "✅ $proj_dir has Properties directory"
            fi
            
            # Check for standard setting files
            if [ ! -f "$proj_dir/Properties/launchSettings.json" ]; then
              echo "Warning: $proj_dir is missing launchSettings.json"
            else
              echo "✅ $proj_dir has launchSettings.json"
            fi
            
            # Check for essential directories based on project type
            if [[ "$proj_dir" == *"API"* ]]; then
              # API project checks
              for dir in "Controllers" "Infrastructure" "Models" "Services"; do
                if [ -d "$proj_dir/$dir" ]; then
                  echo "✅ $proj_dir has $dir directory"
                else
                  echo "Note: $proj_dir is missing $dir directory"
                fi
              done
              
              # Check for appsettings.json
              if [ -f "$proj_dir/appsettings.json" ]; then
                echo "✅ $proj_dir has appsettings.json"
              else
                echo "Warning: $proj_dir is missing appsettings.json"
              fi
              
              # Check for environment-specific settings
              if [ -f "$proj_dir/appsettings.Development.json" ]; then
                echo "✅ $proj_dir has appsettings.Development.json"
              else
                echo "Warning: $proj_dir is missing appsettings.Development.json"
              fi
            fi
          done
          
          # Check for .editorconfig
          if [ -f ".editorconfig" ]; then
            echo "✅ Project has .editorconfig"
          else
            echo "Warning: Missing .editorconfig file for consistent code style"
          fi
          
          # Check for README.md
          if [ -f "README.MD" ] || [ -f "README.md" ]; then
            echo "✅ Project has README file"
          else
            echo "Warning: Missing README.md documentation file"
          fi
          
          # Check for .gitignore
          if [ -f ".gitignore" ]; then
            echo "✅ Project has .gitignore"
          else
            echo "Warning: Missing .gitignore file"
          fi
          
          # Check for global.json
          if [ -f "global.json" ]; then
            echo "✅ Project has global.json for SDK version pinning"
          else
            echo "Note: No global.json found (SDK version not pinned)"
          fi
          
          echo "Project structure check completed!"
          
  assembly-validation:
    name: Assembly Validation
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Validate Assembly Settings
        run: |
          echo "Checking assembly settings..."
          
          # Check for assembly info
          echo "Checking for assembly version info..."
          VERSION_COUNT=$(find . -name "*.csproj" -type f -exec grep -l "<Version>" {} \; | wc -l)
          
          # Check project files for version info
          if [ "$VERSION_COUNT" -eq 0 ]; then
            echo "::warning::No projects have explicit version information. Consider adding <Version> tags."
          else
            find . -name "*.csproj" -type f -exec grep -l "<Version>" {} \; | while read file; do
              echo "✅ Project with version: $file"
              grep "<Version>" "$file"
            done
          fi
          
          # Check for assembly attributes in main projects
          echo "Checking for assembly attributes..."
          # Look for AssemblyInfo.cs files or equivalent in modern .NET
          ASSEMBLY_INFO_COUNT=$(find . -name "AssemblyInfo.cs" -o -name "*.AssemblyInfo.cs" | wc -l)
          
          if [ "$ASSEMBLY_INFO_COUNT" -eq 0 ]; then
            echo "Note: No AssemblyInfo.cs files found. Assembly attributes may be defined in .csproj files in modern .NET."
          else
            find . -name "AssemblyInfo.cs" -o -name "*.AssemblyInfo.cs" | while read file; do
              echo "Assembly info found in: $file"
              # Check for common assembly attributes
              for attr in "AssemblyTitle" "AssemblyDescription" "AssemblyCompany" "AssemblyProduct" "AssemblyCopyright"; do
                if grep -q "$attr" "$file"; then
                  echo "✅ $attr attribute found"
                else
                  echo "Missing $attr attribute in $file"
                fi
              done
            done
          fi
          
          # Check for nullable reference types (modern C# practice)
          echo "Checking for nullable reference types configuration..."
          NULLABLE_COUNT=$(find . -name "*.csproj" -type f -exec grep -l "<Nullable>" {} \; | wc -l)
          TOTAL_PROJECTS=$(find . -name "*.csproj" | wc -l)
          
          if [ "$NULLABLE_COUNT" -eq "$TOTAL_PROJECTS" ]; then
            echo "✅ All projects ($NULLABLE_COUNT/$TOTAL_PROJECTS) have nullable reference types configured"
          else
            echo "::warning::Only $NULLABLE_COUNT of $TOTAL_PROJECTS projects have nullable reference types configured"
          fi
          
          find . -name "*.csproj" -type f -exec grep -l "<Nullable>" {} \; | while read file; do
            NULLABLE_VALUE=$(grep "<Nullable>" "$file" | sed 's/.*<Nullable>\(.*\)<\/Nullable>.*/\1/')
            echo "Project: $file, Nullable: $NULLABLE_VALUE"
            
            if [ "$NULLABLE_VALUE" != "enable" ]; then
              echo "::warning::Project $file has Nullable set to '$NULLABLE_VALUE' instead of 'enable'"
            fi
          done
          
          # Check for strong naming and signing
          echo "Checking for strong naming and signing configuration..."
          STRONG_NAME_COUNT=$(find . -name "*.csproj" -type f -exec grep -l "<SignAssembly>" {} \; | wc -l)
          
          if [ "$STRONG_NAME_COUNT" -eq 0 ]; then
            echo "Note: No projects are configured for strong naming. This is optional but recommended for libraries."
          else
            find . -name "*.csproj" -type f -exec grep -l "<SignAssembly>" {} \; | while read file; do
              echo "✅ Project configured for strong naming: $file"
              grep -A2 "<SignAssembly>" "$file"
            done
          fi
          
          # Check for proper Target Framework
          echo "Checking target frameworks..."
          find . -name "*.csproj" -type f | while read file; do
            TARGET=$(grep -m1 "<TargetFramework>" "$file" || echo "Not specified")
            echo "Project: $file, Target Framework: $TARGET"
          done
          
          # Check for proper language version
          echo "Checking language version..."
          find . -name "*.csproj" -type f -exec grep -l "<LangVersion>" {} \; | while read file; do
            echo "Project with explicit language version: $file"
            grep "<LangVersion>" "$file"
          done
          
          echo "Assembly validation completed!"

  code-metrics:
    name: Code Metrics Analysis
    runs-on: ubuntu-latest
    needs: [restore, build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Install Dependencies
        run: |
          echo "Installing required dependencies..."
          sudo apt-get update
          sudo apt-get install -y bc

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
      
      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: |
            **/bin/
            **/obj/
          key: ${{ runner.os }}-build-${{ github.sha }}
      
      - name: Install Code Analysis Tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool || echo "ReportGenerator already installed"
          dotnet tool install --global dotnet-coverage || echo "dotnet-coverage already installed"
          # Ensure tools are in PATH
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      
      - name: Basic Code Statistics
        id: basic-stats
        run: |
          echo "Collecting basic code metrics..."
          
          # Create output directory
          mkdir -p code-metrics
          
          # Store file counts for trending (with error handling)
          echo "Recording file and line counts..."
          {
            echo "metric,count,date"
            TOTAL_CS_FILES=$(find . -name "*.cs" -not -path "*/obj/*" -not -path "*/bin/*" | wc -l)
            TEST_FILES=$(find . -path "*/Tests/*" -name "*.cs" -not -path "*/obj/*" -not -path "*/bin/*" | wc -l)
            MAIN_FILES=$(find . -name "*.cs" -not -path "*/Tests/*" -not -path "*/obj/*" -not -path "*/bin/*" | wc -l)
            
            echo "total_csharp_files,$TOTAL_CS_FILES,$(date +%Y-%m-%d)"
            echo "test_files,$TEST_FILES,$(date +%Y-%m-%d)"
            echo "main_code_files,$MAIN_FILES,$(date +%Y-%m-%d)"
            
            # Store metrics as outputs
            echo "total_files=$TOTAL_CS_FILES" >> $GITHUB_OUTPUT
            echo "test_files=$TEST_FILES" >> $GITHUB_OUTPUT
            echo "main_files=$MAIN_FILES" >> $GITHUB_OUTPUT
            
            # Calculate code-to-test ratio if tests exist
            if [ "$TEST_FILES" -gt 0 ]; then
              RATIO=$(echo "scale=2; $MAIN_FILES / $TEST_FILES" | bc 2>/dev/null || echo "N/A")
              echo "code_test_ratio,$RATIO,$(date +%Y-%m-%d)"
              echo "code_test_ratio=$RATIO" >> $GITHUB_OUTPUT
            else
              echo "code_test_ratio,N/A,$(date +%Y-%m-%d)"
              echo "code_test_ratio=N/A" >> $GITHUB_OUTPUT
            fi
          } > code-metrics/file_metrics.csv
      
      - name: Find Complex Files
        id: complexity
        if: success() || failure()
        run: |
          echo "Identifying complex files..."
          {
            echo "file,methods,lines,path"
            # Find files with lots of methods
            find . -name "*.cs" -not -path "*/obj/*" -not -path "*/bin/*" | while read -r file; do
              if [ -f "$file" ]; then
                methods=$(grep -c "public\|private\|protected\|internal.*(" "$file" 2>/dev/null || echo "0")
                lines=$(wc -l < "$file" 2>/dev/null || echo "0")
                
                # Only report files with significant complexity
                if [ "$methods" -gt 10 ] || [ "$lines" -gt 300 ]; then
                  echo "$(basename "$file"),$methods,$lines,$file"
                fi
              fi
            done
          } > code-metrics/complex_files.csv
          
          # Count complex files
          COMPLEX_COUNT=$([ -f code-metrics/complex_files.csv ] && tail -n +2 code-metrics/complex_files.csv | wc -l || echo "0")
          echo "complex_files=$COMPLEX_COUNT" >> $GITHUB_OUTPUT
      
      - name: Run Code Coverage (if tests exist)
        id: coverage
        if: steps.basic-stats.outputs.test_files != '0'
        continue-on-error: true
        run: |
          echo "Running code coverage analysis..."
          
          # Check if unit test project exists
          if [ -d "Tests/API.Tests.Unit" ]; then
            mkdir -p coverage
            
            # Run tests with coverage
            dotnet test Tests/API.Tests.Unit/API.Tests.Unit.csproj --configuration Release --results-directory ./coverage/raw --collect:"XPlat Code Coverage" || echo "Tests failed but continuing"
            
            # Check if coverage results were generated
            if [ -d "./coverage/raw" ] && [ "$(find ./coverage/raw -name "*.xml" | wc -l)" -gt 0 ]; then
              echo "Generating coverage report..."
              reportgenerator -reports:./coverage/raw/*/*.xml -targetdir:./coverage/report -reporttypes:Html || echo "Report generation failed"
              
              # Try to extract coverage percentage
              COVERAGE_FILE=$(find ./coverage/raw -name "*.xml" | head -1)
              if [ -f "$COVERAGE_FILE" ]; then
                LINE_RATE=$(grep -o 'line-rate="[^"]*"' "$COVERAGE_FILE" | head -1 | cut -d '"' -f 2)
                if [ -n "$LINE_RATE" ]; then
                  COVERAGE_PCT=$(echo "$LINE_RATE * 100" | bc 2>/dev/null || echo "N/A")
                  echo "code_coverage=$COVERAGE_PCT" >> $GITHUB_OUTPUT
                fi
              fi
            else
              echo "No coverage data generated"
            fi
          else
            echo "No unit test project found at Tests/API.Tests.Unit"
          fi
      
      - name: Upload Metrics Artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics-report
          path: |
            code-metrics/
            coverage/report/
          retention-days: 14
      
      - name: Generate GitHub Summary
        if: success() || failure()
        run: |
          echo "### 📊 Code Metrics Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| ------ | ----- |" >> $GITHUB_STEP_SUMMARY
          echo "| C# Files | ${{ steps.basic-stats.outputs.total_files }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Main Code Files | ${{ steps.basic-stats.outputs.main_files }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Files | ${{ steps.basic-stats.outputs.test_files }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code to Test Ratio | ${{ steps.basic-stats.outputs.code_test_ratio }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Complex Files | ${{ steps.complexity.outputs.complex_files }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.coverage.outputs.code_coverage }}" ]; then
            echo "| Code Coverage | ${{ steps.coverage.outputs.code_coverage }}% |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Add complex files section if any found
          if [ -f "code-metrics/complex_files.csv" ] && [ "$(tail -n +2 code-metrics/complex_files.csv | wc -l)" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Files to Consider Refactoring" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Methods | Lines |" >> $GITHUB_STEP_SUMMARY
            echo "| ---- | ------- | ----- |" >> $GITHUB_STEP_SUMMARY
            
            # Display top 5 most complex files by method count
            if [ -s code-metrics/complex_files.csv ]; then
              tail -n +2 code-metrics/complex_files.csv | sort -t ',' -k2 -nr | head -5 | while IFS=',' read -r file methods lines path; do
                echo "| $file | $methods | $lines |" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Report generated on $(date)_" >> $GITHUB_STEP_SUMMARY
