# Production compose file
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qauth-api
    ports:
      - "8000:80"
      - "8800:443"
    networks:
      - qauth-network
    volumes:
      - ${HOME}/.aspnet/https:/https/
    environment:
      # ASP.NET Core settings
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ASPNETCORE_HTTPS_PORT=${ASPNETCORE_HTTPS_PORT:-443}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-YourSecurePassword123!}
      
      # Database settings
      - Postgres__Host=${Postgres__Host}
      - Postgres__Database=${Postgres__Database}
      - Postgres__User=${Postgres__User}
      - Postgres__Password=${Postgres__Password}
      
      # JWT settings
      - Jwt__SecretKey=${Jwt__SecretKey}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      
      # Email settings
      - Email__Host=${Email__Host}
      - Email__Port=${Email__Port}
      - Email__EnableSsl=${Email__EnableSsl:-true}
      - Email__Username=${Email__Username}
      - Email__Password=${Email__Password}
      - Email__FromEmail=${Email__FromEmail}
      - Email__Timeout=${Email__Timeout:-10000}
      - Email__UseDefaultCredentials=${Email__UseDefaultCredentials:-false}
      
      # Snowflake settings
      - Snowflake__DatacenterId=${Snowflake__DatacenterId}
      - Snowflake__WorkerId=${Snowflake__WorkerId}
      - Snowflake__Epoch=${Snowflake__Epoch}
      
      # PasswordHasher settings
      - PasswordHasher__Iterations=${PasswordHasher__Iterations}
      - PasswordHasher__SaltSize=${PasswordHasher__SaltSize}
      - PasswordHasher__KeySize=${PasswordHasher__KeySize}
      
      # API settings
      - ApiSettings__Port=${Api__Port}
      
      # Docker indicator
      - DOCKER_RUNNING=true
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: qauth-db
    restart: always
    networks:
      - qauth-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  qauth-network:
    driver: bridge 