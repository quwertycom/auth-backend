# Production compose file
version: '3.8'

services:
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
      target: final
    container_name: qauth-api
    ports:
      - "8000:8000"
    networks:
      - qauth-network
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    environment:
      # ASP.NET Core settings
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8000

      # Database settings
      - POSTGRES_HOST=db
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-qauth_db}
      - POSTGRES_USER=${POSTGRES_USER:-qauth_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qauth_password}

      # JWT settings
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-prod-secret-key-for-jwt-token-authentication}
      - JWT_ISSUER=${JWT_ISSUER:-auth-backend}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-auth-client}

      # Email settings
      - EMAIL_HOST=${EMAIL_HOST:-smtp.example.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_ENABLE_SSL=${EMAIL_ENABLE_SSL:-true}
      - EMAIL_USERNAME=${EMAIL_USERNAME:-smtp_user}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-smtp_password}
      - EMAIL_FROM_EMAIL=${EMAIL_FROM_EMAIL:-noreply@example.com}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-10000}
      - EMAIL_USE_DEFAULT_CREDENTIALS=${EMAIL_USE_DEFAULT_CREDENTIALS:-false}

      # Snowflake settings
      - SNOWFLAKE_DATACENTER_ID=${SNOWFLAKE_DATACENTER_ID:-1}
      - SNOWFLAKE_WORKER_ID=${SNOWFLAKE_WORKER_ID:-1}
      - SNOWFLAKE_EPOCH=${SNOWFLAKE_EPOCH:-2024-01-01T00:00:00Z}

      # PasswordHasher settings
      - PASSWORD_HASHER_ITERATIONS=${PASSWORD_HASHER_ITERATIONS:-10000}
      - PASSWORD_HASHER_SALT_SIZE=${PASSWORD_HASHER_SALT_SIZE:-16}
      - PASSWORD_HASHER_KEY_SIZE=${PASSWORD_HASHER_KEY_SIZE:-32}

      # API settings
      - API_SETTINGS_PORT=${API_SETTINGS_PORT:-8000}

      # Docker indicator
      - DOCKER_RUNNING=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: qauth-db
    restart: always
    networks:
      - qauth-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-qauth_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qauth_password}
      - POSTGRES_DB=${POSTGRES_DB:-qauth_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qauth_user} -d ${POSTGRES_DB:-qauth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: qauth-postgres-data
  dataprotection_keys:
    name: qauth-dataprotection-keys

networks:
  qauth-network:
    name: qauth-network
    driver: bridge