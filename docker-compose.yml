# Production compose file
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qauth-api
    ports:
      - "8000:80"
      - "8800:443"
    networks:
      - qauth-network
    volumes:
      - ${HOME}/.aspnet/https:/https/
    environment:
      # ASP.NET Core settings
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ASPNETCORE_HTTPS_PORT=8800
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=YourSecurePassword123!
      
      # Database settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      
      # JWT settings
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=auth-backend
      - Jwt__Audience=auth-client
      
      # Email settings
      - Email__Host=${EMAIL_HOST}
      - Email__Port=${EMAIL_PORT}
      - Email__EnableSsl=true
      - Email__Username=${EMAIL_USERNAME}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__FromEmail=${EMAIL_FROM}
      - Email__Timeout=10000
      - Email__UseDefaultCredentials=false
      
      # Snowflake settings
      - Snowflake__DatacenterId=1
      - Snowflake__WorkerId=1
      
      # PasswordHasher settings
      - PasswordHasher__Iterations=10000
      - PasswordHasher__SaltSize=16
      - PasswordHasher__KeySize=32
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: qauth-db
    restart: always
    networks:
      - qauth-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  qauth-network:
    driver: bridge 