# Production compose file
version: '3.8'

services:
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
      target: final
    container_name: qauth-api
    ports:
      - "8000:8000"
    networks:
      - qauth-network
    environment:
      # ASP.NET Core settings
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8000
      
      # Database settings
      - Postgres__Host=db
      - Postgres__Database=${POSTGRES_DB:-qauth_db}
      - Postgres__User=${POSTGRES_USER:-qauth_user}
      - Postgres__Password=${POSTGRES_PASSWORD:-qauth_password}
      
      # JWT settings
      - Jwt__SecretKey=${Jwt__SecretKey:-prod-secret-key-for-jwt-token-authentication}
      - Jwt__Issuer=${Jwt__Issuer:-auth-backend}
      - Jwt__Audience=${Jwt__Audience:-auth-client}
      
      # Email settings
      - Email__Host=${Email__Host:-smtp.example.com}
      - Email__Port=${Email__Port:-587}
      - Email__EnableSsl=${Email__EnableSsl:-true}
      - Email__Username=${Email__Username:-smtp_user}
      - Email__Password=${Email__Password:-smtp_password}
      - Email__FromEmail=${Email__FromEmail:-noreply@example.com}
      - Email__Timeout=${Email__Timeout:-10000}
      - Email__UseDefaultCredentials=${Email__UseDefaultCredentials:-false}
      
      # Snowflake settings
      - Snowflake__DatacenterId=${Snowflake__DatacenterId:-1}
      - Snowflake__WorkerId=${Snowflake__WorkerId:-1}
      - Snowflake__Epoch=${Snowflake__Epoch:-2024-01-01T00:00:00Z}
      
      # PasswordHasher settings
      - PasswordHasher__Iterations=${PasswordHasher__Iterations:-10000}
      - PasswordHasher__SaltSize=${PasswordHasher__SaltSize:-16}
      - PasswordHasher__KeySize=${PasswordHasher__KeySize:-32}
      
      # API settings
      - ApiSettings__Port=${Api__Port:-8000}
      
      # Docker indicator
      - DOCKER_RUNNING=true
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: qauth-db
    restart: always
    networks:
      - qauth-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-qauth_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qauth_password}
      - POSTGRES_DB=${POSTGRES_DB:-qauth_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qauth_user} -d ${POSTGRES_DB:-qauth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  qauth-network:
    driver: bridge 