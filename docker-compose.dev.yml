# Development compose file
version: '3.8'

services:
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
      target: final
    container_name: qauth-api-dev
    ports:
      - "8000:8000"
    networks:
      - qauth-network
    volumes:
      - ./API:/app/src
      - nuget_cache:/root/.nuget/packages
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    environment:
      # ASP.NET Core settings
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_DETAILED_ERRORS=1
      
      # Database settings
      - POSTGRES_HOST=db
      - POSTGRES_DATABASE=${POSTGRES_DB:-qauth_db_dev}
      - POSTGRES_USER=${POSTGRES_USER:-qauth_user_dev}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qauth_password_dev}
      
      # JWT settings
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-for-jwt-token-authentication}
      - JWT_ISSUER=auth-backend-dev
      - JWT_AUDIENCE=auth-client-dev
      
      # Email settings (configured for MailHog)
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
      - EMAIL_ENABLE_SSL=false
      - EMAIL_USERNAME=test
      - EMAIL_PASSWORD=test
      - EMAIL_FROM_EMAIL=${EMAIL_FROM:-noreply@example.com}
      - EMAIL_TIMEOUT=10000
      - EMAIL_USE_DEFAULT_CREDENTIALS=false
      
      # Snowflake settings
      - SNOWFLAKE_DATACENTER_ID=1
      - SNOWFLAKE_WORKER_ID=1
      - SNOWFLAKE_EPOCH=2024-01-01T00:00:00Z
      
      # PasswordHasher settings
      - PASSWORD_HASHER_ITERATIONS=10000
      - PASSWORD_HASHER_SALT_SIZE=16
      - PASSWORD_HASHER_KEY_SIZE=32
      
      # API settings
      - API_SETTINGS_PORT=${API_PORT:-8000}
      
      # Docker indicator
      - DOCKER_RUNNING=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: qauth-db-dev
    restart: always
    networks:
      - qauth-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-qauth_user_dev}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qauth_password_dev}
      - POSTGRES_DB=${POSTGRES_DB:-qauth_db_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qauth_user_dev} -d ${POSTGRES_DB:-qauth_db_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: qauth-mailhog-dev
    networks:
      - qauth-network
    ports:
      - "9100:1025" # SMTP server
      - "9000:8025" # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
    name: qauth-postgres-data-dev
  nuget_cache:
    name: dotnet-nuget-cache
  dataprotection_keys:
    name: qauth-dataprotection-keys-dev

networks:
  qauth-network:
    name: qauth-network-dev
    driver: bridge 