# Development compose file
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: qauth-api-dev
    ports:
      - "8000:8000"
    networks:
      - qauth-network
    volumes:
      - .:/app
      - /app/API/bin
      - /app/API/obj
      - nuget_cache:/root/.nuget/packages
    environment:
      # ASP.NET Core settings
      - ASPNETCORE_ENVIRONMENT=DockerDevelopment
      - ASPNETCORE_URLS=http://0.0.0.0:8000
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_DETAILED_ERRORS=1
      
      # Database settings
      - Database__Host=db
      - Database__Database=${POSTGRES_DB}
      - Database__Username=${POSTGRES_USER}
      - Database__Password=${POSTGRES_PASSWORD}
      
      # JWT settings
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=auth-backend-dev
      - Jwt__Audience=auth-client-dev
      
      # Email settings (configured for MailHog)
      - Email__Host=mailhog
      - Email__Port=1025
      - Email__EnableSsl=false
      - Email__Username=test
      - Email__Password=test
      - Email__FromEmail=${EMAIL_FROM}
      - Email__Timeout=10000
      - Email__UseDefaultCredentials=false
      
      # Snowflake settings
      - Snowflake__DatacenterId=1
      - Snowflake__WorkerId=1
      - Snowflake__Epoch=2024-01-01T00:00:00Z
      
      # PasswordHasher settings
      - PasswordHasher__Iterations=10000
      - PasswordHasher__SaltSize=16
      - PasswordHasher__KeySize=32
      
      # API settings
      - ApiSettings__Port=8000
      
      # Docker indicator
      - DOCKER_RUNNING=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: qauth-db-dev
    restart: always
    networks:
      - qauth-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: qauth-mailhog-dev
    networks:
      - qauth-network
    ports:
      - "9100:1025" # SMTP server
      - "9000:8025" # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
    name: qauth-postgres-data-dev
  nuget_cache:
    name: dotnet-nuget-cache

networks:
  qauth-network:
    name: qauth-network-dev
    driver: bridge 