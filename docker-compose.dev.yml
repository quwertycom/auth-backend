# Development compose file
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: qauth-api-dev
    ports:
      - "8000:8000"
    networks:
      - qauth-network
    volumes:
      - .:/app
      - /app/API/bin
      - /app/API/obj
      - nuget_cache:/root/.nuget/packages
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      - ASPNETCORE_Kestrel__EndpointDefaults__Protocols=Http1
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_DETAILED_ERRORS=1
      - DOCKER_RUNNING=true
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: qauth-db-dev
    restart: always
    networks:
      - qauth-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: qauth-postgres-data-dev
  nuget_cache:
    name: dotnet-nuget-cache

networks:
  qauth-network:
    name: qauth-network-dev
    driver: bridge 